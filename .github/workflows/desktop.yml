name: Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (Node 24, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Public-tree release scan
        # Advisory until remaining unexpected hits (fixtures/docs paths) are cleared.
        continue-on-error: true
        run: node orch/tools/release-scan.mjs

  native-windows:
    name: Native host (Windows Rust)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Stage pinned runtime
        run: node apps/desktop/scripts/prepare-runtime.mjs
      - name: Cargo test (offline when possible)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

