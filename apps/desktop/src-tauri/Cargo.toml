[package]
name = "cho-desktop"
version = "0.1.0"
description = "CHO Desktop — Native Subscription CLI Wrapper (ACP/JSONL) + orch Multi-Agent Coordinator"
authors = ["CHO-desktop Contributors"]
edition = "2021"

[lib]
name = "cho_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros"] }
